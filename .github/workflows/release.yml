name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release version
        shell: bash
        run: |
          version=$(dotnet msbuild src/EsoMcp.Server/EsoMcp.Server.csproj -nologo -getProperty:Version)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: pwsh -File scripts/Restore-EsoData.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: dotnet build EsoMcp.sln -c Release --no-restore
      - run: dotnet test EsoMcp.sln -c Release --no-build
      - run: dotnet run --project samples/EsoMcp.Smoke -c Release
      - run: dotnet publish src/EsoMcp.Server -c Release --no-restore -o artifacts/server -p:UseAppHost=false
      - name: Bundle portable server
        shell: bash
        run: |
          cp README.md LICENSE settings.example.json artifacts/server/
          cd artifacts/server
          zip -r ../eso-mcp-portable.zip .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/eso-mcp-portable.zip --title "EsoMcp.NET $GITHUB_REF_NAME" --generate-notes

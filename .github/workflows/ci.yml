name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: pwsh -File scripts/Restore-EsoData.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: dotnet build EsoMcp.sln -c Release --no-restore
      - run: dotnet test EsoMcp.sln -c Release --no-build
      - run: dotnet run --project samples/EsoMcp.Smoke -c Release
      - run: dotnet publish src/EsoMcp.Server -c Release --no-restore -o artifacts/server -p:UseAppHost=false
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: eso-mcp-portable
          path: artifacts/server/
